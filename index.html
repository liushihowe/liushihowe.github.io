<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Shihao Liu · Academic Homepage">
  <meta property="og:title" content="Shihao Liu">
  <meta property="og:description" content="Personal academic homepage focusing on vision-language models and fine-grained image-text matching.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://liushihowe.github.io/">
  <meta property="og:image" content="https://liushihowe.github.io/images/avatar.webp">
  <meta property="og:image:width" content="400">
  <meta property="og:image:height" content="400">
  <meta name="theme-color" id="theme-color" content="#f9f9ff">
  <title>Shihao Liu</title>
  <link rel="canonical" href="https://liushihowe.github.io/">
  <link rel="icon" id="favicon" href="icons/pixel-crown-monet-light.svg" type="image/svg+xml">

  <script>
    var FAV_ICONS = {
      dark: 'icons/pixel-crown-monet-dark.svg',
      light: 'icons/pixel-crown-monet-light.svg'
    };

    function setTheme(scheme) {
      document.documentElement.className = scheme;
      document.documentElement.setAttribute('data-scheme', scheme);
      document.getElementById('favicon').href = FAV_ICONS[scheme];
      document.querySelector('meta[name="color-scheme"]').content = scheme;
      document.getElementById('theme-color').content = scheme === 'dark' ? '#111318' : '#f9f9ff';
    }

    (function() {
      var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
      setTheme(darkQuery.matches ? 'dark' : 'light');
      darkQuery.addEventListener('change', function(e) {
        setTheme(e.matches ? 'dark' : 'light');
      });
    })();
  </script>

  <link rel="stylesheet" href="material-theme-css/light.css">
  <link rel="stylesheet" href="material-theme-css/dark.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <img class="avatar" id="profile-avatar" alt="">
      <div class="hero-info">
        <h1 id="profile-name"></h1>
        <p class="affiliation" id="profile-affiliation"></p>
        <p class="tagline" id="profile-tagline"></p>
        <div class="personal-meta" id="personal-meta"></div>
        <div class="social-links" id="social-links"></div>
      </div>
    </header>

    <section id="research">
      <h2>Research</h2>
      <p id="research-text"></p>
    </section>

    <section id="publications">
      <h2>Publications</h2>
      <div id="pub-list" class="pub-list"></div>
    </section>

    <template id="pub-template">
      <div class="pub-card">
        <div class="pub-teaser">
          <img alt="" loading="lazy">
        </div>
        <div class="pub-body">
          <div class="pub-title"></div>
          <div class="pub-authors"></div>
          <div class="pub-venue"></div>
          <div class="pub-links"></div>
          <div class="pub-description"></div>
        </div>
      </div>
    </template>

    <section id="experience">
      <h2>Experience</h2>
      <div id="exp-list"></div>
    </section>

    <section id="miscellanea" class="miscellanea">
      <h2>Miscellanea</h2>
      <ul id="misc-list"></ul>
    </section>

    <footer>
      <span id="footer-text"></span> · Last updated: <time id="last-updated"></time>
    </footer>
  </main>

  <script>
    (function() {
      var linkLabels = { project: 'Project', arxiv: 'arXiv', paper: 'Paper', code: 'Code', pdf: 'PDF', video: 'Video' };
      var iconPaths = {
        github: 'icons/github.svg',
        wechat: 'icons/wechat.svg',
        bilibili: 'icons/bilibili.svg',
        zhihu: 'icons/zhihu.svg'
      };
      var svgIcons = {};

      function appendText(parent, tag, className, text) {
        var el = document.createElement(tag);
        if (className) el.className = className;
        el.textContent = text;
        parent.appendChild(el);
        return el;
      }

      function renderProfile(p) {
        document.getElementById('profile-avatar').src = p.avatar;
        document.getElementById('profile-avatar').alt = p.name;
        document.getElementById('profile-name').textContent = p.name;
        document.getElementById('profile-affiliation').textContent = p.affiliation;
        document.getElementById('profile-tagline').textContent = p.tagline;

        var metaParts = [];
        if (p.hometown) metaParts.push(p.hometown);
        if (p.birthday) metaParts.push(Math.floor((new Date() - new Date(p.birthday)) / (365.25 * 24 * 60 * 60 * 1000)));
        if (p.gender) metaParts.push(p.gender);

        var metaEl = document.getElementById('personal-meta');
        appendText(metaEl, 'span', 'meta-line', metaParts.join(' · '));
        if (p.email_display) appendText(metaEl, 'span', 'email-line', p.email_display);

        var socialFrag = document.createDocumentFragment();
        p.social.forEach(function(s) {
          var a = document.createElement('a');
          a.href = s.href;
          a.title = s.label;
          a.setAttribute('aria-label', s.label);
          if (s.href.startsWith('http')) { a.target = '_blank'; a.rel = 'noopener'; }
          a.innerHTML = svgIcons[s.icon] || '';
          socialFrag.appendChild(a);
        });
        document.getElementById('social-links').appendChild(socialFrag);

        document.getElementById('research-text').textContent = p.research;

        var expFrag = document.createDocumentFragment();
        p.experience.forEach(function(e) {
          var div = document.createElement('div');
          div.className = 'exp-item';
          appendText(div, 'h3', '', e.title);
          appendText(div, 'p', 'exp-meta', e.meta);
          expFrag.appendChild(div);
        });
        document.getElementById('exp-list').appendChild(expFrag);

        var miscFrag = document.createDocumentFragment();
        p.miscellanea.forEach(function(m) {
          appendText(miscFrag, 'li', '', m);
        });
        document.getElementById('misc-list').appendChild(miscFrag);

        document.getElementById('footer-text').textContent = '© ' + new Date().getFullYear() + ' Shihao Liu';
        document.getElementById('last-updated').textContent = document.lastModified;
      }

      function renderPublications(papers, myName) {
        var container = document.getElementById('pub-list');
        var tmpl = document.getElementById('pub-template');
        var frag = document.createDocumentFragment();

        papers.sort(function(a, b) { return b.year - a.year; }).forEach(function(paper) {
          var card = tmpl.content.cloneNode(true).firstElementChild;
          if (paper.highlight) card.classList.add('highlight');

          var img = card.querySelector('.pub-teaser img');
          if (paper.thumbnail) {
            img.src = paper.thumbnail;
            img.alt = 'Teaser for ' + paper.title;
          } else {
            img.remove();
          }

          card.querySelector('.pub-title').textContent = paper.title;
          var authorsEl = card.querySelector('.pub-authors');
          paper.authors.forEach(function(name, i) {
            if (i) authorsEl.appendChild(document.createTextNode(', '));
            if (name === myName) appendText(authorsEl, 'strong', '', name);
            else authorsEl.appendChild(document.createTextNode(name));
          });
          card.querySelector('.pub-venue').textContent = paper.venue + ' ' + paper.year;

          var linksEl = card.querySelector('.pub-links');
          Object.keys(paper.links || {}).forEach(function(key) {
            var a = document.createElement('a');
            a.href = paper.links[key];
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = linkLabels[key] || key;
            linksEl.appendChild(a);
          });
          if (!linksEl.children.length) linksEl.remove();

          if (paper.description) card.querySelector('.pub-description').textContent = paper.description;
          else card.querySelector('.pub-description').remove();

          frag.appendChild(card);
        });

        container.appendChild(frag);
      }

      Promise.all([
        fetch('data/profile.json').then(function(r) { return r.json(); }),
        fetch('data/publications.json').then(function(r) { return r.json(); }),
        fetch(iconPaths.github).then(function(r) { return r.text(); }),
        fetch(iconPaths.wechat).then(function(r) { return r.text(); }),
        fetch(iconPaths.bilibili).then(function(r) { return r.text(); }),
        fetch(iconPaths.zhihu).then(function(r) { return r.text(); })
      ]).then(function(data) {
        svgIcons.github = data[2];
        svgIcons.wechat = data[3];
        svgIcons.bilibili = data[4];
        svgIcons.zhihu = data[5];
        renderProfile(data[0]);
        renderPublications(data[1], data[0].name);
      });
    })();
  </script>

  <script async src="https://hm.baidu.com/hm.js?195f0fd4dcb5f6a1e29b4404487bd342"></script>
</body>
</html>
